name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install bash bats-core

      - name: Run tests
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          bats cryo.bats
