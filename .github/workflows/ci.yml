name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 5
    # Runner image ships untrusted aws/tap & azure/bicep taps; we use neither.
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install bash

      - name: Run tests
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          bash test_cryo.sh
