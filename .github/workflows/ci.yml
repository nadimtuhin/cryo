name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install bash 4+
        run: brew install bash

      - name: Run tests
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          bash test_cryo.sh
